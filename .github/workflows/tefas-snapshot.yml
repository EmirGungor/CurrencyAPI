name: TEFAS Daily NAV Snapshot

# Runs every weekday at 19:30 Istanbul time (16:30 UTC) — just after TEFAS
# publishes the official closing NAV. Manual dispatch enabled for ad-hoc runs.
on:
  schedule:
    - cron: "30 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tefas-snapshot
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # tefas-crawler is best-effort; failure here is non-fatal.
          pip install tefas-crawler || echo "tefas-crawler install failed — script will write a stub"

      - name: Run TEFAS fetcher
        run: python scripts/fetch_tefas_snapshot.py

      - name: Show snapshot summary
        run: |
          if [ -f public/funds-snapshot.json ]; then
            echo "--- snapshot ---"
            head -c 400 public/funds-snapshot.json
            echo
            echo "----------------"
          fi

      - name: Commit snapshot if changed
        run: |
          git config user.name "tefas-bot"
          git config user.email "tefas-bot@users.noreply.github.com"

          if git diff --quiet public/funds-snapshot.json; then
            echo "No changes — skipping commit."
            exit 0
          fi

          git add public/funds-snapshot.json
          git commit -m "chore(data): TEFAS NAV snapshot $(date -u +%Y-%m-%d)"
          git push
